<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soul Slash</title>
<link rel="stylesheet" href="style.css?v=blaster-recoil">
</head>
<body>
<main>
  <header>
    <div class="brand">SOUL <b>SLASH</b></div>
    <div class="track"><span id="time">0:00</span><i><em id="progress"></em></i><span>2:36</span></div>
  </header>
  <section id="gameShell">
    <canvas id="game" aria-label="네 방향 탄환 베기 리듬게임"></canvas>
    <div id="topHud">
      <div class="boss-label"><span>ENEMY</span><div><i id="bossHp"></i></div></div>
      <div id="combo"><b>0</b><span>CHAIN</span></div>
      <div class="life-label"><span>HP</span><div><i id="life"></i></div></div>
    </div>
    <div id="overdrive"><span>FURY</span><div><i id="overdriveFill"></i></div></div>
    <div id="judge"></div>
    <div id="startPanel">
      <h1>SOUL SLASH</h1>
      <p>네 방향에서 날아오는 탄환을 W A S D로 베세요.</p>
      <button id="start">시작</button>
    </div>
    <div id="resultPanel">
      <strong id="resultTitle">COMPLETE</strong>
      <span id="resultText"></span>
      <button id="retry">다시 시작</button>
    </div>
  </section>
  <div class="dpad" aria-label="방향 베기">
    <button data-dir="up">W</button>
    <button data-dir="left">A</button>
    <button data-dir="down">S</button>
    <button data-dir="right">D</button>
  </div>
  <p class="hint">W A S D · 베기 재사용 0.3초</p>
</main>
<script src="game.js?v=slash-zone-v2"></script>
</body>
</html>
