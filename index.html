<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pulse Breaker</title>
<link rel="stylesheet" href="style.css?v=blaster-recoil">
</head>
<body>
<main>
  <header>
    <div class="brand">PULSE <b>BREAKER</b></div>
    <div class="track"><span id="time">0:00</span><i><em id="progress"></em></i><span>2:36</span></div>
  </header>
  <section id="gameShell">
    <canvas id="game" aria-label="원형 패링 리듬게임"></canvas>
    <div id="topHud">
      <div class="boss-label"><span>CORE</span><div><i id="bossHp"></i></div></div>
      <div id="combo"><b>0</b><span>CHAIN</span></div>
      <div class="life-label"><span>SYNC</span><div><i id="life"></i></div></div>
    </div>
    <div id="overdrive"><span>OVERDRIVE</span><div><i id="overdriveFill"></i></div></div>
    <div id="judge"></div>
    <div id="startPanel">
      <h1>PULSE BREAKER</h1>
      <p>다가오는 파동이 코어에 닿는 순간 패링하세요.</p>
      <button id="start">시작</button>
    </div>
    <div id="resultPanel">
      <strong id="resultTitle">COMPLETE</strong>
      <span id="resultText"></span>
      <button id="retry">다시 시작</button>
    </div>
  </section>
  <button id="pulse" aria-label="패링">PULSE</button>
  <p class="hint">아무 키 / 화면 탭</p>
</main>
<script src="game.js?v=blaster-recoil"></script>
</body>
</html>
